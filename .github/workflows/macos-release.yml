name: macOS release build

# Builds the frozen Swift v2 app as the public macOS download. Manual only; it
# uploads one workflow artifact and creates no GitHub release.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  MARQUEE_VERSION: "2.0.2"
  MARQUEE_BUILD: "441"
  # Official MPVKit release: its Package.swift downloads the prebuilt
  # xcframeworks attached to this tag's GitHub release.
  MPVKIT_TAG: "1.1.0-n9.0.2"
  # The tag is lightweight and could move; the build fails unless the clone
  # is exactly this commit.
  MPVKIT_COMMIT: 98c3453e252922e3136422da3fbb2e341ed9edc8

defaults:
  run:
    # Explicit bash so the runner adds -o pipefail; without it a failing
    # xcodebuild piped through tee would pass.
    shell: bash

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Record Xcode version
        run: |
          xcodebuild -version
          swift --version
          sw_vers

      - name: Fetch MPVKit
        # The project references the local package Vendor/MPVKit-local; put the
        # official release there so the project file stays unchanged.
        run: |
          mkdir -p Vendor
          git clone --depth 1 --branch "${MPVKIT_TAG}" \
            https://github.com/mpvkit/MPVKit.git Vendor/MPVKit-local
          head="$(git -C Vendor/MPVKit-local rev-parse HEAD)"
          echo "MPVKit tag ${MPVKIT_TAG} at ${head}"
          if [ "${head}" != "${MPVKIT_COMMIT}" ]; then
            echo "MPVKit tag ${MPVKIT_TAG} is at ${head}, expected ${MPVKIT_COMMIT}" >&2
            exit 1
          fi

      - name: Build the self-test binary
        # The gate's first `swift run` otherwise links and launches the binary
        # in the same moment, and macOS killed that launch (Killed: 9) on a
        # hosted runner. Build it here so the gate finds it up to date.
        run: |
          mkdir -p artifact
          swift build --package-path . --product marquee-toolchain-gate 2>&1 | tee -a artifact/toolchain-gate.log

      - name: Swift self-tests
        # The SwiftPM harness target needs no app bundle and no display. The
        # full Xcode gate (scripts/quality-gate.sh without --toolchain) stops
        # early here: it fingerprints Vendor/MPVKit-local/Frameworks, the
        # historical local framework payload, which the official MPVKit
        # checkout does not have.
        run: |
          mkdir -p artifact
          ./scripts/quality-gate.sh --toolchain --full 2>&1 | tee artifact/toolchain-gate.log

      - name: Build universal Release app
        run: |
          mkdir -p artifact
          xcodebuild -list -project Marquee.xcodeproj
          xcodebuild \
            -project Marquee.xcodeproj \
            -scheme Marquee \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/derived \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee artifact/xcodebuild.log

      - name: Ad-hoc sign and check the app
        run: |
          app="build/derived/Build/Products/Release/Marquee.app"
          exe="${app}/Contents/MacOS/Marquee"
          test -d "${app}"

          # Xcode embeds every MPVKit xcframework in Contents/Frameworks, but
          # libmpv and FFmpeg are linked into the executable itself, so the
          # embedded copies are unused. Their install names are Xcode build
          # temp paths. Remove every framework that nothing in the bundle
          # loads, directly or through another kept framework, before signing.
          exe_dir="$(dirname "${exe}")"
          rpaths_of() {
            otool -l "$1" | awk '$1 == "cmd" && $2 == "LC_RPATH" { r = 1; next }
              r && $1 == "path" { print $2; r = 0 }'
          }
          expand() {
            # $1 path, $2 loader directory
            case "$1" in
              @executable_path/*) printf '%s\n' "${exe_dir}/${1#@executable_path/}" ;;
              @loader_path/*) printf '%s\n' "$2/${1#@loader_path/}" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }
          is_macho() {
            # A static archive's otool -L lists object members, not loads.
            # Check that first: a universal archive also says Mach-O.
            case "$(file -b "$1")" in
              *"ar archive"*) return 1 ;;
              *Mach-O*) return 0 ;;
              *) return 1 ;;
            esac
          }
          # Every load command of $1 except the file's own install name. A
          # dylib's otool -L lists its LC_ID_DYLIB first; otool -D names it per
          # architecture, so drop one matching line per architecture section.
          loads_of() {
            ids="$(otool -D "$1" | awk 'NF && $0 !~ /:$/ { print $1 }')"
            otool -L "$1" | awk -v ids="${ids}" '
              BEGIN { n = split(ids, a, "\n"); for (i = 1; i <= n; i++) if (a[i] != "") id[a[i]] = 1 }
              /^[^ \t]/ { delete dropped; next }
              /^[ \t]/ {
                if (($1 in id) && !($1 in dropped)) { dropped[$1] = 1; next }
                print $1
              }'
          }
          # dyld searches the executable's rpaths, relative to the executable,
          # for every image it loads.
          exe_rpaths="$(rpaths_of "${exe}" | while IFS= read -r rp; do expand "${rp}" "${exe_dir}"; done)"
          # Print the bundle file that load $1 of file $2 resolves to; return
          # 1 when it does not resolve to a file inside the bundle.
          resolve_in_bundle() {
            r_dep="$1"
            r_dir="$(dirname "$2")"
            case "${r_dep}" in
              @executable_path/*|@loader_path/*)
                r_target="$(expand "${r_dep}" "${r_dir}")"
                if [ -e "${r_target}" ]; then printf '%s\n' "${r_target}"; return 0; fi
                ;;
              @rpath/*)
                r_rpaths="$(printf '%s\n%s\n' "$(rpaths_of "$2")" "${exe_rpaths}" | sort -u)"
                for r_rp in ${r_rpaths}; do
                  r_base="$(expand "${r_rp}" "${r_dir}")"
                  case "${r_base}" in
                    "${app}"/*)
                      if [ -e "${r_base}/${r_dep#@rpath/}" ]; then
                        printf '%s\n' "${r_base}/${r_dep#@rpath/}"
                        return 0
                      fi
                      ;;
                  esac
                done
                ;;
            esac
            return 1
          }

          reach_list="${RUNNER_TEMP}/marquee-loaded-frameworks.txt"
          removed_list="${RUNNER_TEMP}/marquee-removed-frameworks.txt"
          : > "${reach_list}"
          : > "${removed_list}"
          # Roots: every Mach-O file that is not inside an embedded framework
          # (the executable, and any helper or plug-in that could load one).
          work=()
          while IFS= read -r -d '' f; do
            case "${f}" in
              "${app}"/Contents/Frameworks/*.framework/*) continue ;;
            esac
            if is_macho "${f}"; then work+=("${f}"); fi
          done < <(find "${app}/Contents" -type f -print0)
          while [ "${#work[@]}" -gt 0 ]; do
            cur="${work[0]}"
            work=("${work[@]:1}")
            for dep in $(loads_of "${cur}"); do
              target="$(resolve_in_bundle "${dep}" "${cur}")" || continue
              case "${target}" in
                */*.framework/*) ;;
                *) continue ;;
              esac
              fwname="${target%%.framework/*}"
              fwname="${fwname##*/}"
              fwdir="${app}/Contents/Frameworks/${fwname}.framework"
              test -d "${fwdir}" || continue
              grep -qxF "${fwname}" "${reach_list}" && continue
              case "$(file -b "${target}")" in
                *"ar archive"*)
                  echo "${cur} loads ${dep}, which is a static archive" >&2
                  exit 1
                  ;;
              esac
              echo "keeping framework ${fwname} (loaded by ${cur#"${app}"/})"
              printf '%s\n' "${fwname}" >> "${reach_list}"
              while IFS= read -r -d '' f; do
                if is_macho "${f}"; then work+=("${f}"); fi
              done < <(find "${fwdir}" -type f -print0)
            done
          done
          removed=0
          kept=0
          for fw in "${app}"/Contents/Frameworks/*.framework; do
            test -d "${fw}" || continue
            name="$(basename "${fw}" .framework)"
            if grep -qxF "${name}" "${reach_list}"; then
              kept=$((kept + 1))
            else
              echo "removing unloaded framework: ${name}"
              rm -rf "${fw}"
              printf '%s\n' "${name}" >> "${removed_list}"
              removed=$((removed + 1))
            fi
          done
          echo "removed ${removed} unloaded frameworks; ${kept} frameworks kept"
          # Drop the directory if nothing is left in it.
          rmdir "${app}/Contents/Frameworks" 2>/dev/null || true

          codesign --force --deep -s - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"

          archs="$(lipo -archs "${exe}")"
          echo "architectures: ${archs}"
          case " ${archs} " in
            *" arm64 "*) ;;
            *) echo "missing arm64 slice" >&2; exit 1 ;;
          esac
          case " ${archs} " in
            *" x86_64 "*) ;;
            *) echo "missing x86_64 slice" >&2; exit 1 ;;
          esac

          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${app}/Contents/Info.plist")"
          echo "bundle version: ${version}"
          test "${version}" = "${MARQUEE_VERSION}"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${app}/Contents/Info.plist")"
          echo "bundle build: ${build_number}"
          test "${build_number}" = "${MARQUEE_BUILD}"

          # Every Mach-O file in the bundle may load only system libraries or
          # files that ship inside the bundle. libmpv must be linked into the
          # executable itself. A dylib's own install name is not a load.
          ls -l "${app}/Contents/Frameworks" || true
          otool -L "${exe}"
          macho_list="$(mktemp)"
          while IFS= read -r -d '' f; do
            if is_macho "${f}"; then printf '%s\n' "${f}"; fi
          done < <(find "${app}/Contents" -type f -print0) > "${macho_list}"
          test -s "${macho_list}"
          bad=0
          while IFS= read -r f; do
            loader_dir="$(dirname "${f}")"
            rpaths="$(printf '%s\n%s\n' "$(rpaths_of "${f}")" "${exe_rpaths}" | sort -u)"
            deps="$(loads_of "${f}" | sort -u)"
            for dep in ${deps}; do
              case "${dep}" in
                /usr/lib/*|/System/Library/*) continue ;;
                @executable_path/*|@loader_path/*)
                  target="$(expand "${dep}" "${loader_dir}")"
                  if [ ! -e "${target}" ]; then
                    echo "missing: ${f} loads ${dep}" >&2
                    bad=1
                  fi
                  ;;
                @rpath/*)
                  name="${dep#@rpath/}"
                  found=0
                  for rp in ${rpaths}; do
                    base="$(expand "${rp}" "${loader_dir}")"
                    case "${name}" in
                      libswift*.dylib)
                        # The Swift runtime lives in the OS's dyld cache.
                        if [ "${base}" = "/usr/lib/swift" ]; then found=1; break; fi
                        ;;
                    esac
                    case "${base}" in
                      "${app}"/*)
                        if [ -e "${base}/${name}" ]; then found=1; break; fi
                        ;;
                    esac
                  done
                  if [ "${found}" -ne 1 ]; then
                    echo "unresolved: ${f} loads ${dep} (rpaths: $(echo ${rpaths}))" >&2
                    bad=1
                  fi
                  ;;
                *)
                  echo "not allowed: ${f} loads ${dep}" >&2
                  bad=1
                  ;;
              esac
            done
          done < "${macho_list}"
          test "${bad}" -eq 0

          # Write nm's output to a file: grep -q exiting early would kill nm
          # with SIGPIPE and pipefail would fail the step.
          nm -U "${exe}" > "${RUNNER_TEMP}/marquee-symbols.txt"
          grep -q ' _mpv_create$' "${RUNNER_TEMP}/marquee-symbols.txt"

          # The removed frameworks must not be load commands of the executable.
          otool -L "${exe}" > "${RUNNER_TEMP}/marquee-loads.txt"
          while IFS= read -r name; do
            if grep -qF "@rpath/${name}.framework/" "${RUNNER_TEMP}/marquee-loads.txt"; then
              echo "executable still loads removed framework ${name}" >&2
              bad=1
            fi
          done < "${removed_list}"
          test "${bad}" -eq 0

          # No file in the signed app may carry a build-machine temp path.
          # Print every file that does; this is a finding, not something to
          # filter out.
          leak=0
          for needle in '/private/var/folders/' 'swbuild.tmp'; do
            rc=0
            hits="$(grep -rlF -- "${needle}" "${app}")" || rc=$?
            if [ "${rc}" -gt 1 ]; then
              echo "grep failed (${rc}) scanning for ${needle}" >&2
              exit 1
            fi
            if [ -n "${hits}" ]; then
              echo "build-machine path ${needle} found in:" >&2
              printf '%s\n' "${hits}" >&2
              leak=1
            fi
          done
          test "${leak}" -eq 0

          du -sh "${app}"

          # shellcheck source=scripts/lib/bundle-safety.sh
          source scripts/lib/bundle-safety.sh
          verify_app_excludes_local_secrets "${app}"

      - name: Build DMG and checksum
        run: |
          app="build/derived/Build/Products/Release/Marquee.app"
          dmg="Marquee-${MARQUEE_VERSION}.dmg"
          stage="build/dmg-stage"

          rm -rf "${stage}"
          mkdir -p "${stage}" artifact
          ditto "${app}" "${stage}/Marquee.app"

          plist="${app}/Contents/Info.plist"
          {
            echo "Marquee $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")" \
              "(build $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}"))"
            echo "Marquee commit: ${GITHUB_SHA}"
            echo "MPVKit: tag ${MPVKIT_TAG}, commit $(git -C Vendor/MPVKit-local rev-parse HEAD)"
            xcodebuild -version
          } > artifact/BUILD-INFO.txt
          cat artifact/BUILD-INFO.txt

          cp LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.md artifact/BUILD-INFO.txt "${stage}/"
          ln -s /Applications "${stage}/Applications"
          cat > "${stage}/READ ME FIRST.txt" <<'EOF'
          Marquee for macOS

          This build is not signed with an Apple Developer ID and is not
          notarized, so macOS will refuse to open it the first time.

          1. Drag Marquee.app to the Applications folder.
          2. Open Marquee once. When macOS blocks it, go to System Settings,
             Privacy & Security, and choose Open Anyway. (On macOS 14 and
             earlier, right-click Marquee and choose Open instead.)

          If macOS still says the app is damaged or cannot be checked, remove
          the quarantine flag in Terminal and open it again:

              xattr -dr com.apple.quarantine /Applications/Marquee.app

          BUILD-INFO.txt records the Marquee and MPVKit commits, the Xcode
          version and the build number.

          LICENSE is Marquee's license. THIRD_PARTY_NOTICES.md says where the
          libraries bundled in the app come from. THIRD_PARTY_LICENSES.md
          lists each of them with its version, its source and its license text.
          EOF

          # hdiutil create sometimes fails on hosted runners with "Resource
          # busy"; retry before failing the build.
          for attempt in 1 2 3; do
            if hdiutil create \
              -volname "Marquee ${MARQUEE_VERSION}" \
              -srcfolder "${stage}" \
              -ov \
              -format UDZO \
              "artifact/${dmg}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "hdiutil create failed 3 times" >&2
              exit 1
            fi
            sleep 10
          done

          (cd artifact && shasum -a 256 "${dmg}" > "${dmg}.sha256" && cat "${dmg}.sha256")

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Marquee-${{ env.MARQUEE_VERSION }}-macos
          path: |
            artifact/Marquee-${{ env.MARQUEE_VERSION }}.dmg
            artifact/Marquee-${{ env.MARQUEE_VERSION }}.dmg.sha256
            artifact/BUILD-INFO.txt
            artifact/xcodebuild.log
            artifact/toolchain-gate.log
          if-no-files-found: error
          retention-days: 30
